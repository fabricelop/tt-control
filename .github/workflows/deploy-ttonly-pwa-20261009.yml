name: Publicar PWA TTiTTulares y TTendencias · paneles y TOP 30
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-ttonly-pwa-20261009.yml"
permissions:
  contents: read
concurrency:
  group: deploy-tt-readonly-pwa
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fabricelop/europapress-rss
          ref: main
          path: source
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /no-vercel/ttittulares-worker/
            /no-vercel/ttendencias-worker/
            /vercel-webhook/lib/
            /vercel-webhook/ttittulares/
            /vercel-webhook/ttendencias/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar y validar ambas aplicaciones antes del despliegue
        run: |
          set -euo pipefail
          for project in ttittulares ttendencias; do
            (
              cd "source/no-vercel/$project-worker"
              npm install --no-audit --no-fund
              npm run stage
              node --check src/index.js
              node --check "generated/lib/$project-control-handler.js"
              if [ "$project" = "ttendencias" ]; then
                grep -q 'Señales al alza que todavía no están en el TOP 30' "generated/assets/ttendencias/index.html"
                grep -q 'TOP 30' "generated/assets/ttendencias/explicadas/index.html"
                grep -q '20261009-top30-operational-v1' "generated/assets/ttendencias/index.html"
                ! grep -q 'Señales todavía fuera del Top 10' "generated/assets/ttendencias/index.html"
              fi
              npx wrangler deploy --dry-run --outdir "/tmp/$project-bundle"
            )
          done
      - name: Desplegar Workers conservando secretos y parámetros existentes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          for project in ttittulares ttendencias; do
            (
              cd "source/no-vercel/$project-worker"
              npx wrangler deploy --keep-vars --config wrangler.jsonc
            )
          done
      - name: Comprobar endpoints de salud de las dos aplicaciones
        run: |
          set -euo pipefail
          for url in \
            https://ttittulares-no-vercel-test.fabricelop.workers.dev/health \
            https://ttendencias-no-vercel-test.fabricelop.workers.dev/health; do
            curl --fail --silent --show-error --max-time 20 "$url" | head -c 500
            echo
          done
