name: Hotfix Telegram durable decision
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix-telegram-durable-decision.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch durable Telegram decision
        shell: python
        run: |
          from pathlib import Path
          p=Path('tt-control/src/index.ts')
          s=p.read_text()
          old="""  await mutateTtGithubJson(env,'ttittulares/decisions.json',(status==='published'?'Publicar':'Desestimar')+' TTiTTulares desde Telegram',(doc:any)=>{\n    doc.project=doc.project||'TTiTTulares';doc.items=Array.isArray(doc.items)?doc.items:[];\n    let row=doc.items.find((x:any)=>String(x.event_id||'')===id);\n    if(!row){row={event_id:id};doc.items.push(row)}\n    Object.assign(row,{status,updated_at:now,decision_source:'telegram',telegram_message_id:messageId});\n    doc.updated_at=now;return doc\n  });"""
          new="""  // Persist first in D1 so Telegram acknowledgement never depends on GitHub availability/rate limits.\n  await ensureEditorialSchema(env);\n  await env.DB.prepare(\"INSERT INTO app_settings(key,value,updated_at) VALUES(?,?,datetime('now')) ON CONFLICT(key) DO UPDATE SET value=excluded.value,updated_at=excluded.updated_at\")\n    .bind('ttittulares_decision:'+id,JSON.stringify({event_id:id,status,updated_at:now,decision_source:'telegram',telegram_message_id:messageId})).run();\n  try{\n    await mutateTtGithubJson(env,'ttittulares/decisions.json',(status==='published'?'Publicar':'Desestimar')+' TTiTTulares desde Telegram',(doc:any)=>{\n      doc.project=doc.project||'TTiTTulares';doc.items=Array.isArray(doc.items)?doc.items:[];\n      let row=doc.items.find((x:any)=>String(x.event_id||'')===id);\n      if(!row){row={event_id:id};doc.items.push(row)}\n      Object.assign(row,{status,updated_at:now,decision_source:'telegram',telegram_message_id:messageId});\n      doc.updated_at=now;return doc\n    });\n  }catch(e){console.log('decisions GitHub diferido; decisión ya persistida en D1',String(e))}"""
          if old not in s:
            raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tt-control/src/index.ts
          git commit -m "Fix Telegram: decisión durable aunque GitHub falle"
          git push
