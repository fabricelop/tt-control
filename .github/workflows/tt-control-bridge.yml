name: TT Control bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths:
      - 'bridge/results/*.json'
      - 'bridge/sync-request.txt'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pending:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[sync-pending]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read PROCESSING queue from TT Control
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          mkdir -p bridge
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            "https://tt-control.fabricelop.workers.dev/api/agent/pending" \
            -o /tmp/pending.json
          python -m json.tool /tmp/pending.json >/dev/null
          COUNT=$(python - <<'PY'
          import json
          with open('/tmp/pending.json', encoding='utf-8') as f:
              print(len(json.load(f).get('news', [])))
          PY
          )
          echo "pending_count=$COUNT" >> "$GITHUB_ENV"

      - name: Publish editorial queue branch
        if: env.pending_count != '0'
        run: |
          git config user.name "tt-control-bridge"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B tt-control-editorial origin/main
          mkdir -p bridge
          cp /tmp/pending.json bridge/pending.json
          git add bridge/pending.json
          if git diff --cached --quiet; then
            echo "Queue unchanged"
            exit 0
          fi
          git commit -m "Editorial queue: ${pending_count} item(s) ready for ChatGPT"
          git push --force-with-lease origin tt-control-editorial

      - name: Open editorial pull request when needed
        if: env.pending_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view tt-control-editorial --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Editorial PR already open; commit update will trigger ChatGPT."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head tt-control-editorial \
              --title "TT Control · cola editorial" \
              --body "Cola automática de noticias en Elaborando. No fusionar manualmente: la actividad de esta PR sirve como disparador de la tarea editorial de ChatGPT."
          fi

  deliver-results:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[sync-pending]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deliver new editorial results to TT Control
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          set -e
          git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'bridge/results/*.json' > /tmp/result_files
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Delivering $file"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $BRIDGE_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$file" \
              "https://tt-control.fabricelop.workers.dev/api/agent/complete"
            echo
          done < /tmp/result_files
