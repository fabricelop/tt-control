name: TT Control bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths:
      - 'bridge/results/*.json'
      - 'bridge/sync-request.txt'
      - 'tt-control/src/index.ts'
      - 'tt-control/wrangler.jsonc'
      - '.github/workflows/tt-control-bridge.yml'

permissions:
  contents: write

jobs:
  deploy-worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare account usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          q='''query($accountTag: String!, $since: DateTime!, $until: DateTime!) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(limit: 10000, filter: {datetime_geq: $since, datetime_leq: $until}) { sum { requests errors } dimensions { scriptName status } } } } }'''
          import datetime
          now=datetime.datetime.now(datetime.timezone.utc); since=now.replace(hour=0,minute=0,second=0,microsecond=0)
          body=json.dumps({'query':q,'variables':{'accountTag':account,'since':since.isoformat().replace('+00:00','Z'),'until':now.isoformat().replace('+00:00','Z')}}).encode()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=body,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req) as r:
              data=json.load(r)
            rows=data.get('data',{}).get('viewer',{}).get('accounts',[{}])[0].get('workersInvocationsAdaptive',[])
            print('CF_USAGE_ROWS='+json.dumps(rows,separators=(',',':')))
            print('CF_REQUESTS_TODAY='+str(sum((x.get('sum') or {}).get('requests',0) or 0 for x in rows)))
            if data.get('errors'): print('CF_GRAPHQL_ERRORS='+json.dumps(data['errors']))
          except Exception as e: print('CF_USAGE_CHECK_FAILED='+repr(e))
          PY

      - name: Inspect Cloudflare workers.dev settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          for path in ['/workers/subdomain','/workers/services/tt-control','/workers/services/fabcalendar-bot']:
            req=urllib.request.Request(base+path,headers=headers)
            try:
              with urllib.request.urlopen(req) as r: data=json.load(r)
              print('CF_INSPECT '+path+' '+json.dumps(data,separators=(',',':')))
            except urllib.error.HTTPError as e:
              print('CF_INSPECT '+path+' HTTP '+str(e.code)+' '+e.read().decode(errors='replace'))
            except Exception as e: print('CF_INSPECT '+path+' FAILED '+repr(e))
          PY

      - name: Inspect Worker subdomain routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':'Bearer '+t}
          for n in ['tt-control','fabcalendar-bot']:
            u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/services/{n}/environments/production/subdomain'
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=h)) as r:d=json.load(r)
              print('WORKER_ROUTE '+n+' '+json.dumps(d,separators=(',',':')))
            except Exception as e: print('WORKER_ROUTE '+n+' '+repr(e))
          PY

      - name: Inspect Cloudflare zones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']
          u='https://api.cloudflare.com/client/v4/zones?account.id='+a+'&per_page=50'
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'Bearer '+t})) as r:d=json.load(r)
            print('CF_ZONES '+json.dumps([{'id':x.get('id'),'name':x.get('name'),'status':x.get('status')} for x in d.get('result',[])],separators=(',',':')))
          except Exception as e: print('CF_ZONES_FAILED '+repr(e))
          PY

      - name: Test alternate Worker preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':'Bearer '+t}
          for n in ['tt-control','fabcalendar-bot']:
            u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/services/{n}/environments/production/content'
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=h)) as r:
                print('SCRIPT_CONTENT '+n+' HTTP '+str(r.status)+' TYPE '+str(r.headers.get('content-type')))
            except Exception as e: print('SCRIPT_CONTENT '+n+' '+repr(e))
          PY

      - name: Create Pages fallback probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/tt-fallback
          printf '%s' '<!doctype html><meta charset="utf-8"><title>TT Control fallback</title><h1>TT Control fallback OK</h1>' > /tmp/tt-fallback/index.html
          npx wrangler pages project create tt-control-access --production-branch=main || true
          npx wrangler pages deploy /tmp/tt-fallback --project-name=tt-control-access --branch=main

      - name: Probe public DNS and HTTPS
        run: |
          python - <<'PY'
          import socket,urllib.request
          for h in ['tt-control.fabricelop.workers.dev','fabcalendar-bot.fabricelop.workers.dev','tt-control-access.pages.dev']:
            try: print('DNS',h,socket.getaddrinfo(h,443))
            except Exception as e: print('DNS_FAIL',h,repr(e))
            try:
              with urllib.request.urlopen('https://'+h+'/',timeout=10) as r: print('HTTPS',h,r.status,r.geturl())
            except Exception as e: print('HTTPS_FAIL',h,repr(e))
          PY

      - name: Deploy TT Control Worker
        working-directory: tt-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy


  sync-pending:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[sync-pending]') || github.event.head_commit.modified[0] == 'bridge/sync-request.txt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TT Control cycle
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            "https://tt-control.fabricelop.workers.dev/api/agent/run" \
            -o /tmp/run.json
          python -m json.tool /tmp/run.json

      - name: Read PROCESSING queue from TT Control
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          mkdir -p bridge
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            "https://tt-control.fabricelop.workers.dev/api/agent/pending" \
            -o /tmp/pending.json
          python -m json.tool /tmp/pending.json >/dev/null
          COUNT=$(python - <<'PY'
          import json
          with open('/tmp/pending.json', encoding='utf-8') as f:
              print(len(json.load(f).get('news', [])))
          PY
          )
          echo "pending_count=$COUNT" >> "$GITHUB_ENV"

      - name: Publish editorial queue snapshot
        run: |
          git config user.name "tt-control-bridge"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          mkdir -p bridge
          cp /tmp/pending.json bridge/pending.json
          git add bridge/pending.json
          if git diff --cached --quiet; then
            echo "Queue unchanged"
            exit 0
          fi
          git commit -m "Editorial queue: ${pending_count} item(s) ready for ChatGPT [skip ci]"
          git push origin main

  deliver-results:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[sync-pending]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deliver new editorial results to TT Control
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          set -e
          git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'bridge/results/*.json' > /tmp/result_files
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Delivering $file"
            HTTP=$(curl --silent --show-error \
              -o /tmp/delivery-response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $BRIDGE_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$file" \
              "https://tt-control.fabricelop.workers.dev/api/agent/complete" || true)
            cat /tmp/delivery-response.json || true
            echo
            if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
              echo "::error file=$file::TT Control rejected result (HTTP $HTTP)"
              FAILED=$((FAILED+1))
            fi
          done < /tmp/result_files
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Notify Telegram of new Listas
        env:
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          COUNT=$(grep -cve '^$' /tmp/result_files || true)
          [ "$COUNT" -gt 0 ] || exit 0
          if [ -z "$TELEGRAM_WEBHOOK_URL" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "Telegram webhook URL/secret not configured in GitHub; skipping notification."
            exit 0
          fi
          export COUNT
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-tt-control-notify: 1" \
            -H "x-tt-control-secret: $TELEGRAM_WEBHOOK_SECRET" \
            --data "$(python -c 'import json,os; print(json.dumps({"count":int(os.environ["COUNT"])}))')" \
            "$TELEGRAM_WEBHOOK_URL"
