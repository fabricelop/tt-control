name: TT Control bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths:
      - 'bridge/results/*.json'
      - 'bridge/sync-request.txt'
      - 'tt-control/src/index.ts'
      - 'tt-control/wrangler.jsonc'
      - '.github/workflows/tt-control-bridge.yml'

permissions:
  contents: write

jobs:
  deploy-worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy TT Control Worker
        working-directory: tt-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy


  sync-pending:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[sync-pending]') || github.event.head_commit.modified[0] == 'bridge/sync-request.txt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TT Control cycle
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            "https://tt-control.fabricelop.workers.dev/api/agent/run" \
            -o /tmp/run.json
          python -m json.tool /tmp/run.json

      - name: Read PROCESSING queue from TT Control
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          mkdir -p bridge
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            "https://tt-control.fabricelop.workers.dev/api/agent/pending" \
            -o /tmp/pending.json
          python -m json.tool /tmp/pending.json >/dev/null
          COUNT=$(python - <<'PY'
          import json
          with open('/tmp/pending.json', encoding='utf-8') as f:
              print(len(json.load(f).get('news', [])))
          PY
          )
          echo "pending_count=$COUNT" >> "$GITHUB_ENV"

      - name: Publish editorial queue snapshot
        run: |
          git config user.name "tt-control-bridge"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          mkdir -p bridge
          cp /tmp/pending.json bridge/pending.json
          git add bridge/pending.json
          if git diff --cached --quiet; then
            echo "Queue unchanged"
            exit 0
          fi
          git commit -m "Editorial queue: ${pending_count} item(s) ready for ChatGPT [skip ci]"
          git push origin main

  deliver-results:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[sync-pending]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deliver new editorial results to TT Control
        env:
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          set -e
          git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'bridge/results/*.json' > /tmp/result_files
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Delivering $file"
            HTTP=$(curl --silent --show-error \
              -o /tmp/delivery-response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $BRIDGE_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$file" \
              "https://tt-control.fabricelop.workers.dev/api/agent/complete" || true)
            cat /tmp/delivery-response.json || true
            echo
            if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
              echo "::error file=$file::TT Control rejected result (HTTP $HTTP)"
              FAILED=$((FAILED+1))
            fi
          done < /tmp/result_files
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Notify Telegram of new Listas
        env:
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          COUNT=$(grep -cve '^$' /tmp/result_files || true)
          [ "$COUNT" -gt 0 ] || exit 0
          if [ -z "$TELEGRAM_WEBHOOK_URL" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "Telegram webhook URL/secret not configured in GitHub; skipping notification."
            exit 0
          fi
          export COUNT
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-tt-control-notify: 1" \
            -H "x-tt-control-secret: $TELEGRAM_WEBHOOK_SECRET" \
            --data "$(python -c 'import json,os; print(json.dumps({"count":int(os.environ["COUNT"])}))')" \
            "$TELEGRAM_WEBHOOK_URL"
