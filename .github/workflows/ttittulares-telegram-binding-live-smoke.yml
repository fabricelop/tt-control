name: TTiTTulares Telegram callback live binding smoke (NO user decisions)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttittulares-telegram-binding-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify tt-control service binding with deliberately INVALID callback
        shell: bash
        run: |
          set -euo pipefail
          url='https://tt-control.fabricelop.workers.dev/api/telegram-webhook'
          # No Telegram update ID and no real callback ID, so the TTiTTulares
          # Worker MUST ignore it without GitHub writes or message deletions.
          payload='{"callback_query":{"id":"invalid-probe","data":"tt:p:TEST-NO-DECISION","message":{"message_id":0,"chat":{"id":0}}}}'
          for n in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 25 -o /tmp/probe.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -d "$payload" "$url") || code=0
            echo "ATTEMPT=$n HTTP=$code"
            head -c 250 /tmp/probe.json || true
            echo
            if [[ "$code" == 200 ]]; then
              python3 - <<'PY'
          import json
          d=json.load(open('/tmp/probe.json'))
          if d.get('ok') is not True or d.get('ignored') is not True:
              raise SystemExit('Callback not safely ignored or TTit service binding not active')
          print('TTITTULARES_TELEGRAM_SERVICE_BINDING_LIVE_OK_NO_MUTATION')
          PY
              exit 0
            fi
            sleep 6
          done
          exit 2
      - name: Auditar Worker Instagram y estado D1 de Trump (sin publicar)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get("CF_API_TOKEN","")
          account=os.environ.get("CF_ACCOUNT_ID","")
          if not token or not account:
              print("TRUMP_CF_AUDIT_MISSING_SECRETS")
              raise SystemExit(0)
          base="https://api.cloudflare.com/client/v4/accounts/"+account
          def call(path,payload=None):
              url=base+path
              req=urllib.request.Request(url,method="POST" if payload else "GET",headers={
                  "Authorization":"Bearer "+token,"Content-Type":"application/json","User-Agent":"TT-IG-Trump-ReadOnly/1.0"},
                  data=json.dumps(payload).encode() if payload else None)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.loads(r.read(65536))
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read(65536))
                  except Exception:return e.code,{}
              except Exception as e:return 0,{"error_type":type(e).__name__}
          rc,result=call("/workers/scripts/ttittulares-no-vercel-test/settings")
          names=set()
          response=result.get("result") if isinstance(result,dict) else None
          if isinstance(response,dict):
              names={str(b.get("name","")) for b in (response.get("bindings") or []) if isinstance(b,dict)}
          expected=("INSTAGRAM_PUBLISHER_URL","INSTAGRAM_INTERNAL_SECRET","INSTAGRAM_ALLOWED_CHAT_ID",
                    "GITHUB_TOKEN","TTITTULARES_CALLBACK_DECRYPT_KEY")
          print("TRUMP_TTI_WORKER_SETTINGS",json.dumps({"http":rc,"success":result.get("success"),"required_bindings":{name:name in names for name in expected}},ensure_ascii=False),flush=True)
          db="4eacd44c-212c-4a49-a907-fbbf561b969f"
          sql="SELECT state,media_id,permalink,container_id,updated_at FROM instagram_posts WHERE id = ? LIMIT 1"
          rc,result=call("/d1/database/"+db+"/query",{"sql":sql,"params":["ttittulares:2dd09208e418"]})
          rows=(((result.get("result") or [{}])[0].get("results") or []) if isinstance(result.get("result"),list) and result.get("result") else [])
          print("TRUMP_INSTAGRAM_D1",json.dumps({"http":rc,"success":result.get("success"),"row":rows[0] if rows else None,"error_codes":[e.get("code") for e in (result.get("errors") or []) if isinstance(e,dict)]},ensure_ascii=False),flush=True)
          print("TRUMP_CLOUDFLARE_AUDIT_READ_ONLY_COMPLETE")
          PY
