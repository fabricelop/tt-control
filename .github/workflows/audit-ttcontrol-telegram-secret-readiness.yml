# Comprobación tras habilitar conversación contextual de TTiTTulares (sin mostrar credenciales)
name: Audit TT Control webhook secret readiness (no credentials printed)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ttcontrol-telegram-secret-readiness.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - shell: bash
        run: |
          for k in CF_TOKEN CF_ACCOUNT BOT_TOKEN WEBHOOK_SECRET CHAT_ID; do
            if [[ -n "${!k:-}" ]]; then echo "$k=present"; else echo "$k=absent"; fi
          done
