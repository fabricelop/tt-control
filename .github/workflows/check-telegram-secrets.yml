name: Comprobar secretos Telegram TT Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-telegram-secrets.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          print("BOT_PRESENT", bool(os.environ.get("BOT")))
          print("CHAT_PRESENT", bool(os.environ.get("CHAT")))
          if not os.environ.get("BOT") or not os.environ.get("CHAT"):
              raise SystemExit(1)
          PY
