name: Activar webhook Telegram en Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-vercel-telegram-webhook.yml"

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar webhook
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -e
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          curl --fail --silent --show-error             -X POST             -H "x-tt-admin-secret: $TELEGRAM_WEBHOOK_SECRET"             "https://europapress-rss.vercel.app/api/telegram-webhook-admin"
          echo
