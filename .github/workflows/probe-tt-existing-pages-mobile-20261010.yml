name: Probe existing TT Pages mobile hostname (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-tt-existing-pages-mobile-20261010.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe Pages routes, DNS, project configuration without mutation
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime,socket
          token=os.getenv('CF_API_TOKEN','')
          account=os.getenv('CF_ACCOUNT_ID','')
          base='https://tt-control-access.pages.dev'
          hosts=['tt-control-access.pages.dev','tt-control.fabricelop.workers.dev','ttendencias-no-vercel-test.fabricelop.workers.dev','ttittulares-no-vercel-test.fabricelop.workers.dev']
          resolved={}
          for host in hosts:
            try:resolved[host]=sorted({row[4][0] for row in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
            except Exception as e:resolved[host]=[type(e).__name__]
          checks={}
          for path in ['/','/health','/ttittulares/','/ttendencias/','/api/ttittulares-control','/api/ttendencias-control?view=state','/tt-shared/gag-copy.html?app=ttendencias']:
            req=urllib.request.Request(base+path,headers={'User-Agent':'TT-Pages-mobile-probe/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=13) as r:
                content=r.read(256).decode('utf8','replace')
                checks[path]={'http':r.status,'content_type':r.headers.get('Content-Type',''),'prefix':content[:100]}
            except urllib.error.HTTPError as e:checks[path]={'http':e.code}
            except Exception as e:checks[path]={'http':0,'error':type(e).__name__}
          metadata={'http':0}
          if token and account:
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/tt-control-access',headers={'Authorization':'Bearer '+token})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                result=json.load(r).get('result') or {}
                metadata={'http':r.status,'name':result.get('name'),'subdomain':result.get('subdomain'),
                          'production_branch':result.get('production_branch'),'latest_deployment_url':(result.get('latest_deployment') or {}).get('url'),
                          'deployment_count':len(result.get('deployments') or [])}
            except urllib.error.HTTPError as e:metadata={'http':e.code}
            except Exception as e:metadata={'http':0,'error':type(e).__name__}
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'dns':resolved,'pages':checks,'project':metadata}
          with open('/tmp/tt-pages-probe.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print('PAGES_MOBILE_PROBE',json.dumps(out,ensure_ascii=False))
          PY
      - name: Record read-only outcome
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/tt-pages-probe.json tt-control/tt-pages-mobile-probe-20261010.json
            git add tt-control/tt-pages-mobile-probe-20261010.json
            git commit -m "Record existing Pages mobile access probe" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
