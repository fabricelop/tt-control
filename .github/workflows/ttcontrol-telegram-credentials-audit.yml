# Comprobación tras habilitar conversación contextual de TTiTTulares (sin mostrar credenciales)
name: TT Control Telegram delivery prerequisites (safe diagnostic)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttcontrol-telegram-credentials-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tt-control/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: List Worker secret NAMES only
        working-directory: tt-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.148.0 secret list --config ./wrangler.jsonc |
          python3 -c 'import sys,json; d=json.load(sys.stdin); print("WORKER_SECRET_NAMES="+",".join(sorted(x["name"] for x in d)))'
      - name: Check D1 bot token presence and chat ID, never print values
        working-directory: tt-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.148.0 d1 execute tt-control --remote --json \
            --command "SELECT key,CASE WHEN length(value)>8 THEN 'present' ELSE 'absent' END AS status FROM app_settings WHERE key IN ('telegram_bot_token','telegram_chat_id') ORDER BY key;" \
            --config ./wrangler.jsonc
