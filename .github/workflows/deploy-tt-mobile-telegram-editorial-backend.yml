name: TT mobile Telegram editorial backend deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-tt-mobile-telegram-editorial-backend.yml'
permissions:
  contents: read
jobs:
  deploy-ttittulares:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check required Cloudflare credentials without showing values
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Checkout public TT app source
        uses: actions/checkout@v4
        with:
          repository: fabricelop/europapress-rss
          ref: main
          path: editorial
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & test prior to any deployment
        working-directory: editorial/no-vercel/ttittulares-worker
        run: |
          npm install --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run --outdir .wrangler-mobile-telegram-check
      - name: Deploy TT worker retaining existing runtime secrets
        working-directory: editorial/no-vercel/ttittulares-worker
        run: npx wrangler deploy --keep-vars
      - name: Verify deployed source and preserve private runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'tt-mobile-telegram-dispatch' editorial/no-vercel/ttittulares-worker/src/index.js
          grep -q 'tt-mobile-command-queue.json' editorial/no-vercel/ttittulares-worker/src/index.js
          echo 'TT_MOBILE_DEPLOY_CONFIRMED: Wrangler succeeded, protected queue route packaged'
          echo 'Public workers.dev HTTP checks intentionally omitted: GitHub runners receive Cloudflare 403 before reaching Worker'
